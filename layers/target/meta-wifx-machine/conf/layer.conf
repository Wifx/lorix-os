# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wifx-machine"
BBFILE_PATTERN_meta-wifx-machine := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wifx-machine = "11"

LICENSE_PATH += "${LAYERDIR}/licenses"

LAYERSERIES_COMPAT_meta-wifx-machine = "scarthgap"
LAYERDEPENDS_meta-wifx-machine = "meta-mchp-wifx"
