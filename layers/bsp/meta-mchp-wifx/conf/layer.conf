# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mchp-wifx"
BBFILE_PATTERN_meta-mchp-wifx := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mchp-wifx = "11"

LAYERSERIES_COMPAT_meta-mchp-wifx = "scarthgap"
