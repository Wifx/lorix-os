# HTTP input rules chain
table inet filter {

    # HTTP flood protection set (blacklist)
    set http_flood {
        type ipv4_addr
        timeout 10s
        size 256
        flags dynamic
    }

    set http6_flood {
        type ipv6_addr
        timeout 10s
        size 256
        flags dynamic
    }

    # HTTP flood protection
    chain httpprotect {
        update @http_flood { ip saddr limit rate over 20/second } drop comment "HTTP: Block excessive IPv4 requests"
        update @http6_flood { ip6 saddr limit rate over 20/second } drop comment "HTTP: Block excessive IPv6 requests"
        
        accept comment "HTTP: Accept normal requests"
    }

    # Independent HTTP input chain (can work standalone)
    chain input {
        # Web services with flood protection and SYN validation
        tcp dport 80 tcp flags & (fin|syn|rst|ack) == syn ct state new jump httpprotect comment "HTTP with flood protection"
        tcp dport 443 tcp flags & (fin|syn|rst|ack) == syn ct state new jump httpprotect comment "HTTPS with flood protection"
    }
}
