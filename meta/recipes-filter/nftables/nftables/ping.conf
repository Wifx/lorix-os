# Rate limiting sets (blacklist)
set ping_flood {
    type ipv4_addr
    timeout 2s
    size 256
    flags dynamic
}

set ping6_flood {
    type ipv6_addr
    timeout 2s
    size 256
    flags dynamic
}

# Ping protect chain
chain pingprotect {
    update @ping_flood { ip saddr limit rate over 4/second } drop comment "PING: Block excessive IPv4 pings"
    update @ping6_flood { ip6 saddr limit rate over 4/second } drop comment "PING: Block excessive IPv6 pings"

    accept comment "PING: Accept normal pings"
}
