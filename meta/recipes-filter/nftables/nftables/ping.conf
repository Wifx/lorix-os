# Ping Protection Configuration
# This file contains ping flood protection and can work independently

# Ping input rules chain for integration with main filter table
table inet filter {

    # Rate limiting sets for flood protection (optimized for embedded systems)
    set ping_flood {
        type ipv4_addr
        timeout 2s
        size 256
        flags dynamic
    }

    set ping6_flood {
        type ipv6_addr
        timeout 2s
        size 256
        flags dynamic
    }

    # PINGPROTECT chain - unified rate limiting logic for both IPv4 and IPv6
    chain pingprotect {
        update @ping_flood { ip saddr limit rate over 4/second } drop comment "PING: Block excessive IPv4 pings"
        update @ping6_flood { ip6 saddr limit rate over 4/second } drop comment "PING: Block excessive IPv6 pings"

        accept comment "PING: Accept normal pings"
    }

    chain input {
        # ICMP handling with ping protection (IPv4/IPv6) / must be done before established check because of conntrack
        ip protocol icmp icmp type echo-request jump pingprotect comment "ICMP echo-request with protection"
        ip6 nexthdr ipv6-icmp icmpv6 type echo-request jump pingprotect comment "ICMPv6 echo-request with protection"
    }
}
