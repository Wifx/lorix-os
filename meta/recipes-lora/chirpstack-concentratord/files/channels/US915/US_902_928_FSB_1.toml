# +++
# name: United States 902-928 MHz, FSB 1
# description: Default frequency plan for the United States and Canada, using sub-band 1
# countries: [BO, CA, CO, CR, DO, EC, GY, MX, PA, PY, PE, PR, SR, US, UY, VE]
# +++


# LoRa concentrator configuration.
[gateway.concentrator]

    # Multi spreading-factor channels (LoRa).
    multi_sf_channels=[
        902300000,
        902500000,
        902700000,
        902900000,
        903100000,
        903300000,
        903500000,
        903700000,
    ]

    # LoRa std channel (single spreading-factor).
    [gateway.concentrator.lora_std]
        frequency=903000000
        bandwidth=500000
        spreading_factor=8
