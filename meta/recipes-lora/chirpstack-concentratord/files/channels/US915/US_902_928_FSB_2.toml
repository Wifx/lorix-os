# +++
# name: United States 902-928 MHz, FSB 2 (used by TTN)
# description: Default frequency plan for the United States and Canada, using sub-band 2. TTN Community Network frequency plan.
# countries: [BO, CA, CO, CR, DO, EC, GY, MX, PA, PY, PE, PR, SR, US, UY, VE]
# +++


# LoRa concentrator configuration.
[gateway.concentrator]

    # Multi spreading-factor channels (LoRa).
    multi_sf_channels=[
        903900000,
        904100000,
        904300000,
        904500000,
        904700000,
        904900000,
        905100000,
        905300000,
    ]

    # LoRa std channel (single spreading-factor).
    [gateway.concentrator.lora_std]
        frequency=904600000
        bandwidth=500000
        spreading_factor=8
