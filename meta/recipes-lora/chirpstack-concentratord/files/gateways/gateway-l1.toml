# LoRa gateway configuration of the concentratord
#
# You can update the gateway configuration for the concentratord here.
# Refer to https://www.chirpstack.io/concentratord/install/config/ for details
#
# NOTE: The LORIX Manager will override the antenna_gain and region setting if defined in the Manager

[gateway]

  # Public LoRaWAN network.
  lorawan_public=true

  # Antenna gain (dB).
  antenna_gain=0
  
  model="wifx_l1"

  model_flags=[
    "lora_region-XXX",
    "lora_frontend_rev-X",
  ]

  # Region.
  #
  # The region of the gateway. Options:
  #  EU868, IN865, RU864
  #  US915, AU915, AS923, AS923_2, AS923_3, AS923_4,
  region=""
